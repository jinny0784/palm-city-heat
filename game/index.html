<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm City Heat — an original top-down crime game</title>
<meta name="description" content="Palm City Heat: roam a sunny coastal city on foot and by car, run five jobs for fixer Mara Voss, and stay ahead of the law. An original browser game built for make.fun's gta6-01 bounty.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1 class="brand">Palm City <span>Heat</span></h1>
  <canvas id="game" width="1280" height="800" aria-label="Palm City Heat game canvas"></canvas>
  <p class="hint">WASD / arrows — move &amp; drive &nbsp;·&nbsp; Mouse — aim &nbsp;·&nbsp; Click / Space — shoot &nbsp;·&nbsp; E — enter / exit car &nbsp;·&nbsp; Shift — sprint &nbsp;·&nbsp; Esc — pause &nbsp;·&nbsp; M — mute</p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
